[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pipeline"
version = "0.1.0"
description = "OCR pipeline module"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0,<4",
  "flask-cors>=4.0.0,<6",
  "werkzeug>=3.0.0,<4",
  "boto3>=1.34.0,<2",
  "botocore>=1.34.0,<2",
  "gunicorn>=22.0.0,<26",
  "numpy>=1.24.0,<3",
  "redis>=5.0.0,<8",
  "Pillow>=10.0.0,<13",
  "opencv-python-headless>=4.8.0,<5",
  "PyMuPDF>=1.23.0,<2",
  "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
# Optional OCR engine; image/PDF/Redis helpers are in the base runtime.
local = [
  "easyocr>=1.7.0,<2",
  "torch>=2.0.0,<3",
]
# LanceDB clustering imports these inside question_clustering, not at server startup.
clustering = [
  "lancedb>=0.6.0",
  "pyarrow>=14.0.0",
  "hdbscan>=0.8.33",
  "scikit-learn>=1.3.0,<2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "requests>=2.31,<3",
]

[tool.setuptools]
packages = ["src", "ai_pipeline"]
package-dir = {"ai_pipeline" = "."}
