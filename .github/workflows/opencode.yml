name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for OpenCode
        required: true
        type: string

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # OpenCode commits fail without this (previous run: empty ident / Author identity unknown)
      - name: Configure git identity
        run: |
          git config --global user.name "Bobby M Khandar"
          git config --global user.email "bobbykhandar1904@gmail.com"

      - name: Run OpenCode
        if: github.event_name != 'workflow_dispatch'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true

      - name: Run OpenCode (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: ${{ inputs.prompt }}
