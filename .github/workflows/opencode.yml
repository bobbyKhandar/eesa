name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for OpenCode
        required: true
        type: string

# Comment events run in the base repository. Keep that token read-only until a
# trusted writer is confirmed; only the gated job below receives write scopes.
permissions:
  contents: read

jobs:
  authorize:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decide whether OpenCode may run
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/opencode-gate.mjs

  opencode:
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      # Force commits to bobbyKhandar only.
      # Bare opencode@users.noreply.github.com maps to unrelated GitHub user "OpenCode".
      # GIT_AUTHOR_* / GIT_COMMITTER_* override any agent that rewrites git config.
      - name: Configure git identity
        run: |
          git config --global user.name "Bobby M Khandar"
          git config --global user.email "bobbykhandar1904@gmail.com"
          git config --local user.name "Bobby M Khandar"
          git config --local user.email "bobbykhandar1904@gmail.com"

      - name: Run OpenCode
        if: github.event_name != 'workflow_dispatch'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Bobby M Khandar
          GIT_AUTHOR_EMAIL: bobbykhandar1904@gmail.com
          GIT_COMMITTER_NAME: Bobby M Khandar
          GIT_COMMITTER_EMAIL: bobbykhandar1904@gmail.com
        with:
          model: opencode/big-pickle
          use_github_token: true

      - name: Run OpenCode (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Bobby M Khandar
          GIT_AUTHOR_EMAIL: bobbykhandar1904@gmail.com
          GIT_COMMITTER_NAME: Bobby M Khandar
          GIT_COMMITTER_EMAIL: bobbykhandar1904@gmail.com
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: ${{ inputs.prompt }}
